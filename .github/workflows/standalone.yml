name: Standalone

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build:
    runs-on: gentoo
    steps:
      - uses: https://github.com/Arniiiii/checkout_path_fix@main

      # - uses: actions/cache@v3
      #   with:
      #     path: "**/cpm_modules"
      #     key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: configure
        run: cmake -Sstandalone -Bbuild -DCMAKE_BUILD_TYPE=Debug --log-level=DEBUG

      - name: build
        run: cmake --build build -j$(nproc) --verbose

      - name: run
        run: ./build/DataMiningLab1 --help
