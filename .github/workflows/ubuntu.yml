name: Ubuntu

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v3
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: configure
        run: cmake -S. -Bbuild -DBUILD_TESTING=1 -DCMAKE_CXX_FLAGS="-ggdb3" -DBUILD_SHARED_LIBS=1 --log-level=DEBUG -DFETCHCONTENT_QUIET=OFF -DCPM_USE_LOCAL_PACKAGES=1

      - name: build
        run: cmake --build build -j$(nproc) --verbose

      - name: test
        run: |
          ctest --test-dir ./build -j $(nproc) --verbose

      # - name: collect code coverage
      #   run: bash <(curl -s https://codecov.io/bash) || echo "Codecov did not collect coverage reports"
